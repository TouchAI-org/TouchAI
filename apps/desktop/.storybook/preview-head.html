<style>
    /*
     * The product serif face, served by .storybook/product-font-plugin.js from the
     * same verified file the app downloads. Declaring it here rather than in CSS
     * keeps the story bundle free of a build-time font step.
     *
     * `format('woff2-variations')` is the form CSS Fonts 4 defines for a variable font;
     * without it the engine loads the file as static and silently substitutes the system
     * serif. The same declaration, with the reasoning and measurements, is in
     * src/utils/font.ts.
     */
    @font-face {
        font-family: 'TouchAI Source Han Serif SC';
        src: url('/product-font/SourceHanSerifSC-VF.ttf.woff2') format('woff2-variations');
        font-weight: 250 900;
        font-style: normal;
        font-display: block;
    }

    /* Storybook paints its own canvas; match the app window instead. */
    html,
    body {
        background: var(--color-background-primary);
    }
</style>
