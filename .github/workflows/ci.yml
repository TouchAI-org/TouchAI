name: CI

# Required contexts must still be reported when expensive validation is unnecessary.
on:
    push:
        branches:
            - main
    pull_request:
    merge_group:
        types:
            - checks_requested

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    changes:
        name: Classify PR changes
        runs-on: ubuntu-latest
        outputs:
            docs_only: ${{ steps.classify.outputs.docs_only }}
            desktop_changed: ${{ steps.classify.outputs.desktop_changed }}
            site_changed: ${{ steps.classify.outputs.site_changed }}
            release_notes_changed: ${{ steps.classify.outputs.release_notes_changed }}
        steps:
            - id: classify
              name: Detect docs-only pull requests
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
              with:
                  script: |
                      const fullClassification = () => {
                        core.setOutput('docs_only', 'false');
                        core.setOutput('desktop_changed', 'true');
                        core.setOutput('site_changed', 'true');
                        core.setOutput('release_notes_changed', 'true');
                      };

                      if (
                        context.eventName !== 'pull_request' &&
                        context.eventName !== 'push' &&
                        context.eventName !== 'merge_group'
                      ) {
                        fullClassification();
                        return;
                      }

                      const releaseNotesPattern =
                        /^apps\/desktop\/release-notes\/[^/]+\.json$/;
                      const docsOnlyPatterns = [
                        /^docs\//,
                        /^[^/]+\.md$/,
                        /^COPYING$/,
                        /^\.github\/ISSUE_TEMPLATE\//,
                        /^\.github\/dependabot\.yml$/,
                        /^\.github\/labeler\.yml$/,
                        /^\.github\/labels\.yml$/,
                        /^\.github\/pull_request_template\.md$/,
                        /^CLAUDE\.md$/,
                        /^CODE_OF_CONDUCT\.md$/,
                        /^CONTRIBUTING\.md$/,
                        /^README\.en\.md$/,
                        /^README\.md$/,
                        /^SECURITY\.md$/,
                        /^SUPPORT\.md$/,
                        releaseNotesPattern,
                      ];
                      const desktopPatterns = [
                        /^apps\/desktop\//,
                        /^packages\//,
                        /^package\.json$/,
                        /^pnpm-lock\.yaml$/,
                        /^pnpm-workspace\.yaml$/,
                        /^\.cargo\//,
                        /^Cargo\.toml$/,
                        /^Cargo\.lock$/,
                        /^rust-toolchain$/,
                        /^rust-toolchain\.toml$/,
                        /^eslint\.config\.js$/,
                        /^\.prettierrc$/,
                        /^\.prettierignore$/,
                        /^\.github\/workflows\/ci\.yml$/,
                        /^\.github\/workflows\/ui-preview\.yml$/,
                        /^\.github\/ui-preview\//,
                        /^tests\/ci\/ui-preview\//,
                      ];
                      const sitePatterns = [
                        /^apps\/site\//,
                        /^packages\//,
                        /^package\.json$/,
                        /^pnpm-lock\.yaml$/,
                        /^pnpm-workspace\.yaml$/,
                        /^\.prettierrc$/,
                        /^\.prettierignore$/,
                        /^\.github\/workflows\/ci\.yml$/,
                      ];

                      let files = [];

                      if (context.eventName === 'pull_request') {
                        files = await github.paginate(github.rest.pulls.listFiles, {
                          ...context.repo,
                          pull_number: context.issue.number,
                          per_page: 100,
                        });
                      } else if (
                        context.eventName === 'push' ||
                        context.eventName === 'merge_group'
                      ) {
                        const before =
                          context.eventName === 'merge_group'
                            ? context.payload.merge_group?.base_sha
                            : context.payload.before;
                        const after =
                          context.eventName === 'merge_group'
                            ? context.payload.merge_group?.head_sha
                            : context.payload.after;

                        if (!before || !after || /^0+$/.test(before)) {
                          fullClassification();
                          return;
                        }

                        const comparison = await github.rest.repos.compareCommits({
                          ...context.repo,
                          base: before,
                          head: after,
                        });

                        files = comparison.data.files ?? [];

                        if (!Array.isArray(files) || files.length >= 300) {
                          fullClassification();
                          return;
                        }
                      }

                      if (!Array.isArray(files) || files.length === 0) {
                        fullClassification();
                        return;
                      }

                      if (context.eventName === 'pull_request') {
                        const expectedCount = context.payload.pull_request?.changed_files;

                        if (
                          files.length >= 3000 ||
                          (Number.isInteger(expectedCount) && expectedCount !== files.length)
                        ) {
                          fullClassification();
                          return;
                        }
                      }

                      const validFilename = (value) =>
                        typeof value === 'string' && value.trim().length > 0;
                      const validFiles = files.every((file) => {
                        if (file === null || typeof file !== 'object') {
                          return false;
                        }

                        const hasPrevious = Object.prototype.hasOwnProperty.call(
                          file,
                          'previous_filename'
                        );

                        return (
                          validFilename(file.filename) &&
                          (!hasPrevious || validFilename(file.previous_filename)) &&
                          (file.status !== 'renamed' || validFilename(file.previous_filename))
                        );
                      });

                      if (!validFiles) {
                        fullClassification();
                        return;
                      }

                      const filenames = files.flatMap((file) =>
                        file.previous_filename
                          ? [file.filename, file.previous_filename]
                          : [file.filename]
                      );
                      const docsOnly =
                        filenames.every((filename) =>
                          docsOnlyPatterns.some((pattern) => pattern.test(filename))
                        );
                      const desktopChanged =
                        !docsOnly &&
                        filenames.some((filename) =>
                          desktopPatterns.some((pattern) => pattern.test(filename))
                        );
                      const siteChanged =
                        filenames.some((filename) => sitePatterns.some((pattern) => pattern.test(filename)));
                      const releaseNotesChanged = filenames.some((filename) =>
                        releaseNotesPattern.test(filename)
                      );

                      core.setOutput('docs_only', docsOnly ? 'true' : 'false');
                      core.setOutput('desktop_changed', desktopChanged ? 'true' : 'false');
                      core.setOutput('site_changed', siteChanged ? 'true' : 'false');
                      core.setOutput(
                        'release_notes_changed',
                        releaseNotesChanged ? 'true' : 'false'
                      );

            - name: Report classification
              run: |
                  echo "docs_only=${{ steps.classify.outputs.docs_only }}"
                  echo "desktop_changed=${{ steps.classify.outputs.desktop_changed }}"
                  echo "site_changed=${{ steps.classify.outputs.site_changed }}"
                  echo "release_notes_changed=${{ steps.classify.outputs.release_notes_changed }}"

    # A workflow file that GitHub cannot parse never starts a job: the run fails in
    # zero seconds with an "Invalid workflow file" annotation and nothing to read. The
    # only way to see that before merging is to validate the files here, and the only
    # way to keep it from recurring is to fail the pull request that introduces it.
    workflow-lint:
        name: Workflow Lint
        needs: changes
        if: needs.changes.outputs.docs_only != 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install actionlint
              env:
                  ACTIONLINT_VERSION: 1.7.12
                  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              run: |
                  set -euo pipefail
                  archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -sSfLo "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
                  printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c -
                  tar -xzf "$archive" actionlint

            - name: Lint workflows
              run: ./actionlint

    release-notes-check:
        name: Release Notes
        needs: changes
        if: needs.changes.outputs.release_notes_changed == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  package-manager-cache: false

            - name: Validate release notes
              run: node apps/desktop/scripts/ci/validate-release-notes.mjs

    conventional-commits:
        name: Conventional Commits
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --filter . --ignore-scripts

            - name: Validate pull request title
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

            - name: Validate commit messages
              run: |
                  pnpm exec commitlint \
                    --from "${{ github.event.pull_request.base.sha }}" \
                    --to "${{ github.event.pull_request.head.sha }}" \
                    --verbose

    dependency-review:
        name: Dependency Review
        if: github.event_name == 'pull_request'
        needs: changes
        runs-on: ubuntu-latest
        steps:
            - name: Skip dependency review for docs-only PRs
              if: needs.changes.outputs.docs_only == 'true'
              run: echo 'Dependency review is not required for docs-only pull requests.'

            - name: Dependency review
              if: needs.changes.outputs.docs_only != 'true'
              uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
              with:
                  # Tauri/Wry currently pulls the vulnerable GTK3 glib 0.18 chain on Linux,
                  # and upstream has no non-vulnerable GTK3 release path yet.
                  # Tauri's HTML/CSS parsing chain currently pulls rand 0.7.x through
                  # phf/kuchikiki, which still has no direct non-vulnerable Tauri path.
                  allow-ghsas: GHSA-wrw7-89jp-8q8g, GHSA-cq8v-f236-94qc

    frontend-quality:
        name: Frontend Quality
        needs: changes
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.desktop_changed == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Skip frontend quality checks for docs-only PRs
              if: needs.changes.outputs.docs_only == 'true'
              run: echo 'Frontend quality checks are skipped for docs-only changes.'

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              if: needs.changes.outputs.docs_only != 'true'

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
              if: needs.changes.outputs.docs_only != 'true'

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              if: needs.changes.outputs.docs_only != 'true'
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              if: needs.changes.outputs.docs_only != 'true'
              run: pnpm install --frozen-lockfile

            - name: Type check
              if: needs.changes.outputs.docs_only != 'true'
              run: pnpm type:check

            - name: Type check tests
              if: needs.changes.outputs.docs_only != 'true'
              run: pnpm test:typecheck

            - name: Lint
              if: needs.changes.outputs.docs_only != 'true'
              run: pnpm lint:check

            - name: Format check
              if: needs.changes.outputs.docs_only != 'true'
              run: pnpm format:check

    frontend-test-shards:
        name: Frontend Tests (Shard ${{ matrix.shard }}/3)
        needs: changes
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.desktop_changed == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run frontend test shard
              run: >-
                  pnpm --filter @touchai/desktop exec vitest run
                  --config vitest.ci-shard.config.ts
                  --configLoader runner
                  --coverage
                  --shard=${{ matrix.shard }}/3
                  --reporter=default
                  --reporter=blob

            - name: Upload frontend shard report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: frontend-shard-${{ matrix.shard }}
                  path: apps/desktop/.vitest-reports/blob-${{ matrix.shard }}-3.json
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 3

    frontend-tests:
        name: Frontend Tests
        needs:
            - changes
            - frontend-test-shards
        if: always() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.desktop_changed == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Verify frontend test shards succeeded
              env:
                  SHARDS_RESULT: ${{ needs.frontend-test-shards.result }}
              run: |
                  if [ "$SHARDS_RESULT" != "success" ]; then
                    echo "::error::Frontend test shards did not all succeed (result: ${SHARDS_RESULT:-missing})."
                    exit 1
                  fi

            # The merge queue checks out the PR's merge commit (main + this branch), which would
            # make every source file merged into main since this branch started look like part
            # of this change. Check out the branch head instead, and keep full history so the
            # merge-base the patch-coverage gate needs is present.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --filter @touchai/desktop...

            - name: Download frontend shard reports
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: frontend-shard-*
                  merge-multiple: true
                  path: apps/desktop/.vitest-reports

            - name: Verify frontend shard artifacts
              run: node .github/scripts/assert-frontend-shards.mjs apps/desktop/.vitest-reports 3

            - name: Merge frontend shard reports with coverage
              run: >-
                  pnpm --filter @touchai/desktop exec vitest
                  --config vitest.config.ts
                  --configLoader runner
                  --merge-reports=.vitest-reports
                  --coverage

            - name: Summarize coverage
              run: node apps/desktop/scripts/ci/coverage/summarize-coverage.mjs --kind frontend --input apps/desktop/.coverage/unit/coverage-summary.json

            # The global floor guards the repository as a whole; this guards the diff, so a
            # change cannot add uncovered behaviour while the total stays flat.
            #
            # The base is the PR's base SHA, not a raw diff target: the script resolves it to
            # the merge base, so commits merged into main after this branch started are not
            # blamed on this change. Only a PR has a base to compare against.
            - name: Check patch coverage
              if: github.event_name == 'pull_request'
              run: >-
                  node apps/desktop/scripts/ci/coverage/patch-coverage-cli.mjs
                  --coverage apps/desktop/.coverage/unit/coverage-final.json
                  --base "${{ github.event.pull_request.base.sha }}"
                  --root .
                  --floor 85

            - name: Upload coverage artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: frontend-coverage-report
                  path: apps/desktop/.coverage/unit
                  if-no-files-found: error

    ci-tests:
        name: CI Tests
        needs: changes
        if: needs.changes.outputs.docs_only != 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run UI preview tests
              run: pnpm test:ui-preview

            - name: Type check repository CI tests
              run: pnpm test:ci:typecheck

            - name: Lint repository CI tests
              run: pnpm exec eslint tests/ci vitest.ci.config.ts

            - name: Run repository CI tests
              run: pnpm test:ci

    site-build:
        name: Site Build
        needs: changes
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.site_changed == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --filter @touchai/site...

            - name: Build site
              run: pnpm site:build

    rust-checks:
        name: Rust Checks
        needs: changes
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.desktop_changed == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Skip Rust checks for docs-only PRs
              if: needs.changes.outputs.docs_only == 'true'
              run: echo 'Rust checks are skipped for docs-only changes.'

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              if: needs.changes.outputs.docs_only != 'true'

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
              if: needs.changes.outputs.docs_only != 'true'

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              if: needs.changes.outputs.docs_only != 'true'
              with:
                  node-version: 22
                  package-manager-cache: false

            - name: Install Linux system dependencies
              if: needs.changes.outputs.docs_only != 'true'
              run: |
                  sudo apt update
                  sudo apt install -y \
                    build-essential \
                    curl \
                    file \
                    libayatana-appindicator3-dev \
                    libglib2.0-dev \
                    librsvg2-dev \
                    libssl-dev \
                    libwebkit2gtk-4.1-dev \
                    libxdo-dev \
                    pkg-config \
                    wget

            - name: Install Rust stable
              if: needs.changes.outputs.docs_only != 'true'
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
              with:
                  components: llvm-tools-preview

            - name: Rust cache
              if: needs.changes.outputs.docs_only != 'true'
              uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with:
                  workspaces: apps/desktop/src-tauri -> target
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            - name: Check Rust formatting
              if: needs.changes.outputs.docs_only != 'true'
              run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

            - name: Install cargo-llvm-cov
              if: needs.changes.outputs.docs_only != 'true'
              env:
                  LLVM_COV_VERSION: 0.9.1
                  LLVM_COV_SHA256: b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a
              run: |
                  set -euo pipefail
                  archive="$RUNNER_TEMP/cargo-llvm-cov.tar.gz"
                  curl --fail --silent --show-error --location \
                    "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz" \
                    --output "$archive"
                  printf '%s  %s\n' "$LLVM_COV_SHA256" "$archive" | sha256sum --check -
                  mkdir -p "$HOME/.cargo/bin"
                  tar -xzf "$archive" -C "$HOME/.cargo/bin" cargo-llvm-cov
                  cargo llvm-cov --version

            - name: Run Rust coverage
              if: needs.changes.outputs.docs_only != 'true'
              run: pnpm test:coverage:rust

            - name: Locate Rust coverage report
              if: needs.changes.outputs.docs_only != 'true'
              run: |
                  if ! report_path="$(node apps/desktop/scripts/ci/coverage/summarize-coverage.mjs --resolve-rust)"; then
                    echo "::error::cargo-llvm-cov produced no coverage.json; the candidate paths are listed above."
                    exit 1
                  fi
                  echo "RUST_COVERAGE_REPORT=$report_path" >> "$GITHUB_ENV"

            - name: Summarize coverage
              if: needs.changes.outputs.docs_only != 'true'
              run: node apps/desktop/scripts/ci/coverage/summarize-coverage.mjs --kind rust --input "$RUST_COVERAGE_REPORT"

            - name: Upload coverage artifact
              if: needs.changes.outputs.docs_only != 'true'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: rust-coverage-report
                  path: ${{ env.RUST_COVERAGE_REPORT }}
                  if-no-files-found: error

    architecture:
        name: Architecture Boundaries
        needs: changes
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.desktop_changed == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Architecture boundaries, cycles, IPC presence and DB drift
              run: pnpm architecture:check

    build-windows:
        name: Build (Windows)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.desktop_changed == 'true'
        needs: changes
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

            - name: Rust cache
              uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with:
                  workspaces: apps/desktop/src-tauri -> target
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            - name: Get short commit SHA
              id: sha
              run: echo "short=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Tauri app
              uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
              with:
                  projectPath: apps/desktop
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload Windows installer
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: touchai-installer-windows-${{ steps.sha.outputs.short }}
                  path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
                  if-no-files-found: warn

    ci-required:
        name: CI Required
        if: always()
        needs:
            - changes
            - workflow-lint
            - conventional-commits
            - dependency-review
            - release-notes-check
            - frontend-quality
            - frontend-tests
            - ci-tests
            - site-build
            - rust-checks
            - architecture
            - build-windows
        runs-on: ubuntu-latest
        steps:
            - name: Verify required CI jobs
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
                  DESKTOP_CHANGED: ${{ needs.changes.outputs.desktop_changed }}
                  SITE_CHANGED: ${{ needs.changes.outputs.site_changed }}
                  RELEASE_NOTES_CHANGED: ${{ needs.changes.outputs.release_notes_changed }}
                  CHANGES_RESULT: ${{ needs.changes.result }}
                  WORKFLOW_LINT_RESULT: ${{ needs['workflow-lint'].result }}
                  CONVENTIONAL_COMMITS_RESULT: ${{ needs['conventional-commits'].result }}
                  DEPENDENCY_REVIEW_RESULT: ${{ needs['dependency-review'].result }}
                  RELEASE_NOTES_RESULT: ${{ needs['release-notes-check'].result }}
                  FRONTEND_QUALITY_RESULT: ${{ needs['frontend-quality'].result }}
                  FRONTEND_TESTS_RESULT: ${{ needs['frontend-tests'].result }}
                  CI_TESTS_RESULT: ${{ needs['ci-tests'].result }}
                  SITE_BUILD_RESULT: ${{ needs['site-build'].result }}
                  RUST_CHECKS_RESULT: ${{ needs['rust-checks'].result }}
                  ARCHITECTURE_RESULT: ${{ needs['architecture'].result }}
                  BUILD_WINDOWS_RESULT: ${{ needs['build-windows'].result }}
              run: |
                  if [ "$CHANGES_RESULT" = "success" ]; then
                    invalid=0

                    for check in "docs_only:$DOCS_ONLY" "desktop_changed:$DESKTOP_CHANGED" "site_changed:$SITE_CHANGED" "release_notes_changed:$RELEASE_NOTES_CHANGED"; do
                      name="${check%%:*}"
                      value="${check#*:}"

                      if [ "$value" != "true" ] && [ "$value" != "false" ]; then
                        echo "::error::Invalid changes output $name: expected 'true' or 'false', got '${value:-<missing>}'."
                        invalid=1
                      fi
                    done

                    if [ "$invalid" -ne 0 ]; then
                      echo "One or more required CI jobs did not pass."
                      exit 1
                    fi
                  fi

                  required=()

                  required+=("changes:$CHANGES_RESULT")

                  if [ "$RELEASE_NOTES_CHANGED" = "true" ]; then
                    required+=("release-notes-check:$RELEASE_NOTES_RESULT")
                  fi

                  if [ "$EVENT_NAME" = "pull_request" ]; then
                    required+=("conventional-commits:$CONVENTIONAL_COMMITS_RESULT")
                  fi

                  if [ "$DOCS_ONLY" != "true" ]; then
                    required+=("workflow-lint:$WORKFLOW_LINT_RESULT")
                    required+=("ci-tests:$CI_TESTS_RESULT")

                    if [ "$EVENT_NAME" = "pull_request" ]; then
                      required+=("dependency-review:$DEPENDENCY_REVIEW_RESULT")
                    fi

                    if [ "$DESKTOP_CHANGED" = "true" ]; then
                      required+=("frontend-quality:$FRONTEND_QUALITY_RESULT")
                      required+=("frontend-tests:$FRONTEND_TESTS_RESULT")
                      required+=("rust-checks:$RUST_CHECKS_RESULT")
                      required+=("architecture:$ARCHITECTURE_RESULT")
                    fi

                    if [ "$SITE_CHANGED" = "true" ]; then
                      required+=("site-build:$SITE_BUILD_RESULT")
                    fi

                    if [ "$EVENT_NAME" = "push" ] && [ "$DESKTOP_CHANGED" = "true" ]; then
                      required+=("build-windows:$BUILD_WINDOWS_RESULT")
                    fi
                  fi

                  failed=0
                  observed=(
                    "changes:$CHANGES_RESULT"
                    "workflow-lint:$WORKFLOW_LINT_RESULT"
                    "conventional-commits:$CONVENTIONAL_COMMITS_RESULT"
                    "dependency-review:$DEPENDENCY_REVIEW_RESULT"
                    "release-notes-check:$RELEASE_NOTES_RESULT"
                    "frontend-quality:$FRONTEND_QUALITY_RESULT"
                    "frontend-tests:$FRONTEND_TESTS_RESULT"
                    "ci-tests:$CI_TESTS_RESULT"
                    "site-build:$SITE_BUILD_RESULT"
                    "rust-checks:$RUST_CHECKS_RESULT"
                    "architecture:$ARCHITECTURE_RESULT"
                    "build-windows:$BUILD_WINDOWS_RESULT"
                  )

                  for check in "${observed[@]}"; do
                    name="${check%%:*}"
                    result="${check#*:}"

                    if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
                      echo "$name unexpectedly ended with $result."
                      failed=1
                    fi
                  done

                  for check in "${required[@]}"; do
                    name="${check%%:*}"
                    result="${check#*:}"
                    echo "$name -> $result"

                    if [ "$result" != "success" ]; then
                      failed=1
                    fi
                  done

                  if [ "$failed" -ne 0 ]; then
                    echo "One or more required CI jobs did not pass."
                    exit 1
                  fi
