name: Approve visual baselines

# Regenerates the visual baselines for a pull request when its reviewer asks for it,
# in the same pinned environment that compares them, and commits the result back to
# the branch under review.
#
# Why this exists rather than "run it locally and push":
#
# A baseline is only valid against the renderer that produced it. A developer machine
# renders the same code with a different Chromium build, different system fonts and a
# different device pixel ratio, so a baseline generated there fails on CI for reasons
# that have nothing to do with the change — and passes locally while the comparison
# that actually gates the pull request keeps failing.
#
# Why a comment rather than an automatic step:
#
# Approving a baseline is a decision — "this is what it should look like now" — and
# the person who makes it is the reviewer, not the author, and not a schedule. A job
# that rewrites baselines whenever they differ turns every visual test into a recorder
# of whatever the code currently does, silently absorbing the regressions it was added
# to catch.
#
# Why it dispatches the existing workflows instead of running the suites itself:
#
# The renderer is defined by `visual-components.yml` (the pinned Playwright image) and
# by `e2e-smoke.yml` (the Windows/WebView2 driver setup). Running the suites here would
# mean a second copy of both, and a baseline is only comparable if it comes from the
# exact configuration that will later compare it. So this file orchestrates and never
# re-implements.
#
# About the checks that must run on the commit this workflow pushes:
#
# GitHub suppresses workflow runs for events caused by the built-in `GITHUB_TOKEN`, so a
# commit pushed with it lands on the branch without starting the `pull_request` workflows
# that gate the pull request — and branch protection then sits at "Waiting for status to
# be reported".
#
# A `workflow_dispatch` run does not help: GitHub only counts check runs from `push`,
# `pull_request`, `pull_request_review`, `pull_request_target`, `deployment` and
# `deployment_status` towards required status checks, so a dispatched run's checks never
# appear on the pull request (see docs.github.com, "Troubleshooting required status
# checks"). An earlier version of this file wrongly claimed otherwise.
#
# The fix is the credential, not the trigger. The push is made with a GitHub App
# installation token from `BOT_APP_ID` / `BOT_APP_PRIVATE_KEY`, whose `push` event is an
# ordinary push and therefore does produce eligible checks. The App is already installed
# on this repository and scoped to it, which is what makes this acceptable where a broad
# personal access token would not be: the credential is short-lived (one hour), it is
# issued per run, and it cannot be used anywhere except the repositories the App is
# installed on.
#
# The comparison workflows are still dispatched after the push. They are no longer needed
# for branch protection, but the dispatch leaves a run behind that compares the new
# baselines against themselves, which is a cheap way to notice a renderer that produced
# something it cannot reproduce.
#
# Usage, in a pull request comment:
#
#     /approve-visuals              regenerate both layers
#     /approve-visuals components   regenerate the component layer only
#     /approve-visuals e2e          regenerate the app (WebView2) layer only
#
# The command has to start a line, and it has to come from a person. The visual report
# itself mentions `/approve-visuals` in a sentence, and the report is posted as a bot, so a
# substring match made every first report start a run that failed the write-access check.
# A reply that quotes the hint is the same hazard for a human: it would push a baseline
# commit nobody asked for.
#
# The shape of the file follows from the two layers being the same job with different
# inputs. `plan` decides which layers were asked for; one matrix job then regenerates
# each of them, serialised so the two commits land one after the other. The layers differ
# only in which workflow to dispatch, which artifact to download, which directory to
# commit and what to call the commit, so those four values are the matrix entries and
# everything else is shared. A job per layer meant two copies of the dispatch, wait,
# download and push steps, which is how they drifted apart before.
#
# `plan` emits the matrix itself rather than a list of layer names. A job-level `if`
# cannot read `matrix` — GitHub rejects the file, since the matrix is not expanded when
# the condition is evaluated — and a static `include` entry that matches no requested
# layer is expanded into a job of its own, so filtering has to happen before the matrix.
#
# There is no separate report job. The outcome is a status line handed to
# `visual-comment.mjs`, which writes it into the one pull request comment the comparison
# workflows already maintain, next to that layer's last report.

on:
    issue_comment:
        types:
            - created

# Nothing is granted by default: each scope is handed to the one job that needs it.
# `issue_comment` carries write permissions for the whole workflow, so a workflow-wide
# `contents: write` would hand a write-scoped token to the planning job as well, which
# only reads the pull request and reacts to the comment.
permissions: {}

# One approval per pull request at a time. Two concurrent runs would race on the
# commit and one of them would lose its baselines.
concurrency:
    group: approve-visuals-${{ github.event.issue.number }}
    cancel-in-progress: false

jobs:
    plan:
        name: Decide what to regenerate
        # `issue_comment` fires for plain issues too and carries write permissions, so
        # the trigger is narrowed to "a pull request", "a person" and "a comment that
        # mentions the command". Whether the author may actually run it is decided by a
        # step below, which asks the API for the real permission; whether the comment
        # really is the command is decided by the parse step.
        if: |
            github.event.issue.pull_request &&
            github.event.comment.user.type != 'Bot' &&
            contains(github.event.comment.body, '/approve-visuals')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Reading the pull request, and reacting to the command comment. The
            # reaction goes through the issues API, but the comment is always on a pull
            # request here, which this scope covers. No `contents: write`: this job
            # never touches the branch.
            pull-requests: write
        outputs:
            command: ${{ steps.parse.outputs.command }}
            matrix: ${{ steps.parse.outputs.matrix }}
            head_ref: ${{ steps.pr.outputs.head_ref }}
        steps:
            - name: Parse the requested layers
              id: parse
              env:
                  COMMENT_BODY: ${{ github.event.comment.body }}
              run: |
                  set -euo pipefail
                  # The body arrives through the environment, never interpolated into
                  # the script, so a comment cannot smuggle shell syntax into the run.
                  body="$(printf '%s' "$COMMENT_BODY")"

                  # Anchored to the start of a line: the report comment and any reply that
                  # quotes the hint contain the command mid-sentence, and neither is an
                  # approval. The first matching line is the command; its arguments decide
                  # which layers run.
                  command_line="$(printf '%s' "$body" | grep -iE '^[[:space:]]*/approve-visuals([[:space:]]|$)' | head -n1 || true)"

                  if [ -z "$command_line" ]; then
                      echo "command=false" >> "$GITHUB_OUTPUT"
                      echo 'No /approve-visuals command line in this comment; nothing to do.'
                      exit 0
                  fi

                  echo "command=true" >> "$GITHUB_OUTPUT"

                  # Every input a layer needs, in the order the layers run. This is the
                  # one place a layer is defined: the selection below narrows this list,
                  # it does not repeat it.
                  catalog='[
                    {"layer":"components","workflow":"visual-components.yml","artifact":"component-baselines","snapshots":"apps/desktop/tests/visual/__snapshots__","message":"test(ui): refresh the component visual baselines"},
                    {"layer":"e2e","workflow":"e2e-smoke.yml","artifact":"visual-baselines","snapshots":"apps/desktop/e2e-tests/__snapshots__","message":"test(ui): refresh the app visual baselines"}
                  ]'

                  requested='[]'

                  if printf '%s' "$command_line" | grep -qiE '/approve-visuals[[:space:]]+components'; then
                      requested="$(printf '%s' "$requested" | jq -c '. + ["components"]')"
                  fi

                  if printf '%s' "$command_line" | grep -qiE '/approve-visuals[[:space:]]+e2e'; then
                      requested="$(printf '%s' "$requested" | jq -c '. + ["e2e"]')"
                  fi

                  # A bare command means "everything that moved". Requiring the caller
                  # to name a layer every time would make it easy to approve half a
                  # change and leave the other half failing.
                  if [ "$requested" = '[]' ]; then
                      requested='["components","e2e"]'
                  fi

                  matrix="$(printf '%s' "$catalog" | jq -c --argjson requested "$requested" '[.[] | select(.layer as $layer | $requested | index($layer))]')"

                  if [ "$(printf '%s' "$matrix" | jq 'length')" -eq 0 ]; then
                      echo "::error::No layer matched the requested layers $requested; the catalog and the parser disagree."
                      exit 1
                  fi

                  echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

            # `author_association` only says how the author relates to the repository,
            # not what they may do in it: an organisation member or a collaborator can
            # hold read-only or triage access. Rewriting the baselines needs push
            # access, so that is what is checked. Without this any member who can
            # comment could erase the evidence of a regression.
            - name: Require write access
              if: steps.parse.outputs.command == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  AUTHOR: ${{ github.event.comment.user.login }}
              run: |
                  set -euo pipefail
                  permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission)"

                  case "$permission" in
                      admin|maintain|write)
                          echo "$AUTHOR has '$permission' access; the command is allowed."
                          ;;
                      *)
                          echo "::error::$AUTHOR has '$permission' access to $GITHUB_REPOSITORY. Regenerating the baselines needs write access, because it pushes a commit to the branch under review."
                          exit 1
                          ;;
                  esac

            - name: Read the pull request
              id: pr
              if: steps.parse.outputs.command == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_NUMBER: ${{ github.event.issue.number }}
              run: |
                  set -euo pipefail
                  head_ref="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)"
                  head_repo="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRepositoryOwner,headRepository --jq '.headRepositoryOwner.login + "/" + .headRepository.name')"

                  # Pushing back to a fork needs a token that can write there, which the
                  # workflow token cannot do. Say so instead of failing at the push.
                  if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
                      echo "::error::This pull request comes from the fork $head_repo. Regenerate the baselines there and push them yourself; the workflow token cannot write to a fork."
                      exit 1
                  fi

                  echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

            - name: Acknowledge the command
              if: steps.parse.outputs.command == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  COMMENT_ID: ${{ github.event.comment.id }}
              run: |
                  set -euo pipefail
                  # A reaction confirms the command was seen without adding a comment
                  # for every retry.
                  gh api \
                      --method POST \
                      -H "Accept: application/vnd.github+json" \
                      "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
                      -f content=eyes >/dev/null

    regenerate:
        name: Regenerate ${{ matrix.layer }} baselines
        needs: plan
        # A comment that merely mentions the command parses to `command=false` and leaves
        # this job skipped, so quoting the hint costs nothing and touches no branch.
        if: needs.plan.outputs.command == 'true'
        runs-on: ubuntu-latest
        permissions:
            # Checkout and the baseline commit.
            contents: write
            # Dispatching the regeneration run, watching it, and downloading the
            # artifact it leaves behind.
            actions: write
        strategy:
            # Both entries push to the same branch, so they run one at a time in matrix
            # order. That is what keeps the second push from being rejected as a
            # non-fast-forward, and it replaces the old `needs: [plan, components]`
            # chaining.
            max-parallel: 1
            matrix:
                # The layers that were asked for, already narrowed by `plan`. Each entry
                # is one job; `matrix` is unavailable in a job-level `if`, so a layer that
                # was not requested has to be absent from the matrix rather than skipped
                # by a condition. Each entry carries `layer`, `workflow`, `artifact`,
                # `snapshots` and `message`; `plan` defines them and the steps below only
                # read them, so the two layers cannot drift apart.
                include: ${{ fromJSON(needs.plan.outputs.matrix) }}
        steps:
            # The push below has to be an ordinary push, so that its `push` event starts
            # the workflows whose checks the branch protection rule waits for. A token
            # from `GITHUB_TOKEN` cannot do that. The App token is short-lived and scoped
            # to the repositories the App is installed on, which is why it is acceptable
            # here where a personal access token would not be.
            - name: Mint an App token
              id: app
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  app-id: ${{ secrets.BOT_APP_ID }}
                  private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
                  # Only the repositories this App is installed on, and only what the
                  # commit, the dispatch and the comment need.
                  owner: ${{ github.repository_owner }}
                  repositories: ${{ github.event.repository.name }}
                  permission-contents: write
                  permission-actions: write
                  permission-pull-requests: write
                  permission-issues: write

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.plan.outputs.head_ref }}
                  # Push as the App, so the resulting `push` event is not suppressed.
                  token: ${{ steps.app.outputs.token }}

            - name: Regenerate in the pinned environment
              id: regenerate
              env:
                  # `GITHUB_TOKEN` is enough to dispatch and read runs; the push is the
                  # only thing that needs the App.
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  HEAD_REF: ${{ needs.plan.outputs.head_ref }}
                  WORKFLOW: ${{ matrix.workflow }}
              run: |
                  set -euo pipefail
                  workflow="$WORKFLOW"

                  # The dispatch is asynchronous and `gh run list` can only report what
                  # already exists, so the run that existed before the dispatch is the
                  # marker for "this one is new".
                  before="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch "$HEAD_REF" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"

                  gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF" -f update_visual_baselines=true

                  run_id=''
                  for _ in $(seq 1 30); do
                      current="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch "$HEAD_REF" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
                      if [ -n "$current" ] && [ "$current" != "$before" ] && [ "$current" != '0' ]; then
                          run_id="$current"
                          break
                      fi
                      sleep 5
                  done

                  if [ -z "$run_id" ]; then
                      echo "::error::The baseline run never appeared. Check the Actions tab for $workflow on $HEAD_REF."
                      exit 1
                  fi

                  echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                  echo "Watching run $run_id."

            - name: Wait for the run to finish
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RUN_ID: ${{ steps.regenerate.outputs.run_id }}
              run: |
                  set -euo pipefail
                  gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15

            - name: Download the regenerated baselines
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RUN_ID: ${{ steps.regenerate.outputs.run_id }}
                  ARTIFACT: ${{ matrix.artifact }}
                  SNAPSHOTS: ${{ matrix.snapshots }}
              run: |
                  set -euo pipefail
                  gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir "$SNAPSHOTS"

            - name: Commit the regenerated baselines
              id: commit
              env:
                  HEAD_REF: ${{ needs.plan.outputs.head_ref }}
                  APP_SLUG: ${{ steps.app.outputs.app-slug }}
                  SNAPSHOTS: ${{ matrix.snapshots }}
                  MESSAGE: ${{ matrix.message }}
              run: |
                  set -euo pipefail
                  # Attributed to the App rather than to `github-actions`, so `git log`
                  # says which credential produced a baseline refresh.
                  git config user.name "${APP_SLUG}[bot]"
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

                  git add "$SNAPSHOTS"

                  if git diff --cached --quiet; then
                      echo 'These baselines already match; nothing to commit.'
                      echo "pushed=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  git commit -m "$MESSAGE"

                  # The checkout is a snapshot from the start of the job, and the
                  # regeneration ran for minutes. If the author pushed in that window the
                  # branch has moved, and a plain push would be rejected as a
                  # non-fast-forward. Rebasing onto the current tip keeps the baseline
                  # commit on top of their work instead of losing it.
                  git pull --rebase origin "$HEAD_REF"
                  git push origin "HEAD:$HEAD_REF"
                  echo "pushed=true" >> "$GITHUB_OUTPUT"

            # The App push started the `pull_request` workflows on the new commit, so the
            # required checks will appear on their own. Dispatching is kept because it also
            # re-runs the comparison against the baselines that were just written, which is
            # a cheap way to catch a renderer that cannot reproduce its own output.
            - name: Re-run the comparison against the new baselines
              if: steps.commit.outputs.pushed == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  HEAD_REF: ${{ needs.plan.outputs.head_ref }}
                  WORKFLOW: ${{ matrix.workflow }}
              run: |
                  set -euo pipefail
                  gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF" -f update_visual_baselines=false

            # The outcome goes into the comment the comparison workflows already maintain,
            # not into a second comment about the same pixels: one flow, one comment. The
            # next comparison run replaces this layer's section with its own, so the line
            # describes what was done rather than claiming the baselines now match.
            - name: Report the outcome in the shared comment
              env:
                  GH_TOKEN: ${{ steps.app.outputs.token }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.issue.number }}
                  LAYER: ${{ matrix.layer }}
                  STATUS_LINE: ${{ steps.commit.outputs.pushed == 'true' && 'Regenerated these baselines in the environment that gates this pull request and committed them to this branch. Review the new commit before approving.' || 'These baselines already matched, so nothing was committed.' }}
              run: node apps/desktop/scripts/ci/visual-comment.mjs
