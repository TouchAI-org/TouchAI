name: Component Visual Tests

on:
    # `workflow_dispatch` also makes this runnable by hand before it reaches `main`:
    # GitHub only triggers `pull_request` workflows from the base branch's copy of
    # the file, so a brand-new workflow cannot prove itself on its own PR otherwise.
    # It is also how baselines are regenerated in the cloud:
    #   gh workflow run visual-components.yml --ref <branch> -f update_visual_baselines=true
    workflow_dispatch:
        inputs:
            update_visual_baselines:
                description: Regenerate the component baselines and upload them as an artifact instead of comparing.
                type: boolean
                default: false
    pull_request:
    merge_group:
        types:
            - checks_requested
    push:
        branches:
            - main

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        name: Classify PR changes
        runs-on: ubuntu-latest
        outputs:
            ui_changed: ${{ steps.classify.outputs.ui_changed }}
        steps:
            - id: classify
              name: Detect component or style changes
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
              with:
                  script: |
                      // Stories and their baselines only move when components, styles or
                      // the visual harness change. Running the whole Windows E2E suite for
                      // a docs edit is what made people stop reading the check list.
                      const uiPatterns = [
                        /^apps\/desktop\/src\/components\//,
                        /^apps\/desktop\/src\/styles\//,
                        /^apps\/desktop\/src\/views\//,
                        /^apps\/desktop\/tests\/visual\//,
                        /^apps\/desktop\/\.storybook\//,
                        /^apps\/desktop\/playwright\.config\.ts$/,
                        /^apps\/desktop\/package\.json$/,
                        /^pnpm-lock\.yaml$/,
                        /^\.github\/workflows\/visual-components\.yml$/,
                      ];

                      const pullNumber = context.payload.pull_request?.number;
                      if (!pullNumber) {
                        // A manual run has no PR to classify; run everything, which is
                        // what someone dispatching it by hand wants anyway.
                        core.setOutput('ui_changed', 'true');
                        return;
                      }

                      const files = await github.paginate(github.rest.pulls.listFiles, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: pullNumber,
                        per_page: 100,
                      });

                      const changed = files.some((file) => uiPatterns.some((pattern) => pattern.test(file.filename)));
                      core.setOutput('ui_changed', changed ? 'true' : 'false');

    component-visual:
        name: Component Visual Tests
        needs: changes
        if: needs.changes.outputs.ui_changed == 'true' || inputs.update_visual_baselines
        runs-on: ubuntu-latest
        # The renderer is the baseline. Playwright renders with whatever Chromium,
        # fonts and system libraries it finds, so comparing pixels captured in one
        # environment against another is meaningless. This image ships both, pinned,
        # which is what makes the committed PNGs reproducible — and it is why the
        # baselines are generated here rather than on a developer machine.
        #
        # Pinned to the exact `@playwright/test` version in the lockfile: if the two
        # drift, Playwright cannot locate the browser executables at all. The guard
        # step below turns that into a readable error.
        container:
            image: mcr.microsoft.com/playwright:v1.64.1-noble
        env:
            PLAYWRIGHT_IMAGE_TAG: v1.64.1-noble
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  package-manager-cache: false

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            # Browsers and their system dependencies are already in the image, so
            # `playwright install --with-deps` is not needed here. What does need
            # checking is that the image and the lockfile still agree: a mismatch
            # fails later with an opaque "executable doesn't exist", which reads like
            # a broken runner rather than a stale pin.
            - name: Assert the pinned renderer matches the lockfile
              # Inside a container the default shell is `sh` (dash), which rejects
              # `set -o pipefail` and exits 2 before running anything. The scripts in
              # this job are bash, so ask for bash explicitly.
              shell: bash
              # `@playwright/test` is a workspace dependency of `apps/desktop`, and pnpm
              # does not hoist it to the repository root, so the version has to be read
              # from the package that actually declares it.
              working-directory: apps/desktop
              run: |
                  set -euo pipefail
                  image_version="${PLAYWRIGHT_IMAGE_TAG#v}"
                  image_version="${image_version%%-*}"
                  project_version="$(node -p "require('@playwright/test/package.json').version")"

                  if [ "$image_version" != "$project_version" ]; then
                      echo "::error::The renderer image is $PLAYWRIGHT_IMAGE_TAG but @playwright/test is $project_version. Baselines are only comparable when these match: bump the container image and regenerate the baselines in the same change."
                      exit 1
                  fi

                  echo "Renderer $PLAYWRIGHT_IMAGE_TAG matches @playwright/test $project_version."

            # The product font is fetched once per run by the E2E font module and
            # verified against the product sha256; there is nothing to restore
            # beforehand, and a stale cache would be worse than a download.

            - name: Run component visual tests
              if: ${{ !inputs.update_visual_baselines }}
              run: pnpm --filter @touchai/desktop test:visual:components

            # Component baselines are rendered where the gate runs them. Chromium is
            # pinned by the lockfile and renders at deviceScaleFactor 1, so this layer
            # is portable in a way the WebView2 one is not — but "portable" still means
            # "generated on the platform that compares", and that is this runner.
            - name: Regenerate component baselines
              if: ${{ inputs.update_visual_baselines }}
              run: pnpm --filter @touchai/desktop test:visual:components:update

            # A failing comparison leaves the expected, actual and diff images on the
            # runner, which is destroyed when the job ends. This writes the half the
            # reviewer needs — which snapshot moved and what to open — into the run
            # summary, so the report is on the PR instead of inside the log.
            - name: Summarise the visual differences
              if: ${{ !cancelled() && !inputs.update_visual_baselines }}
              working-directory: apps/desktop
              run: node ./scripts/ci/visual-summary.mjs test-results/results.json

            - name: Upload component baselines
              if: ${{ inputs.update_visual_baselines }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: component-baselines
                  path: apps/desktop/tests/visual/__snapshots__/
                  if-no-files-found: error

            - name: Upload diff artifacts
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: component-visual-diffs
                  path: |
                      apps/desktop/test-results/
                  if-no-files-found: ignore
