name: Component Visual Tests

on:
    pull_request:
    merge_group:
        types:
            - checks_requested
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        name: Classify PR changes
        runs-on: ubuntu-latest
        outputs:
            ui_changed: ${{ steps.classify.outputs.ui_changed }}
        steps:
            - id: classify
              name: Detect component or style changes
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
              with:
                  script: |
                      // Stories and their baselines only move when components, styles or
                      // the visual harness change. Running the whole Windows E2E suite for
                      // a docs edit is what made people stop reading the check list.
                      const uiPatterns = [
                        /^apps\/desktop\/src\/components\//,
                        /^apps\/desktop\/src\/styles\//,
                        /^apps\/desktop\/src\/views\//,
                        /^apps\/desktop\/tests\/visual\//,
                        /^apps\/desktop\/\.storybook\//,
                        /^apps\/desktop\/playwright\.config\.ts$/,
                        /^apps\/desktop\/package\.json$/,
                        /^pnpm-lock\.yaml$/,
                        /^\.github\/workflows\/visual-components\.yml$/,
                      ];

                      const files = await github.paginate(github.rest.pulls.listFiles, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: context.payload.pull_request?.number ?? 0,
                        per_page: 100,
                      });

                      const changed = files.some((file) => uiPatterns.some((pattern) => pattern.test(file.filename)));
                      core.setOutput('ui_changed', changed ? 'true' : 'false');

    component-visual:
        name: Component Visual Tests
        needs: changes
        if: needs.changes.outputs.ui_changed == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  package-manager-cache: false

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            # The version is pinned in the lockfile, so the browser build is fixed too;
            # a floating browser version is a common source of "works on my machine"
            # screenshot diffs.
            - name: Install Playwright Chromium
              run: pnpm --filter @touchai/desktop exec playwright install --with-deps chromium

            # Same font file the end-to-end suite uses. Without it every story renders
            # a fallback serif and the baselines describe a typeface nobody ships.
            # The version is in the key so bumping the font starts a fresh cache.
            - name: Cache product font
              uses: actions/cache@9255dc7a253b0ccc959486e2bca265382c262871 # v4
              with:
                  path: .e2e-runtime/font-cache
                  key: product-font-source-han-serif-v2-3-2

            - name: Run component visual tests
              run: pnpm --filter @touchai/desktop test:visual:components

            - name: Upload diff artifacts
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: component-visual-diffs
                  path: apps/desktop/test-results/
                  if-no-files-found: ignore
