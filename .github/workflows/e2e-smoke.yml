name: Desktop E2E Smoke

on:
    push:
        branches:
            - main
    pull_request:
    merge_group:
        types:
            - checks_requested
    workflow_dispatch:
        inputs:
            update_visual_baselines:
                description: Regenerate the visual baselines and upload them as an artifact instead of comparing.
                type: boolean
                default: false

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        name: Classify PR changes
        runs-on: ubuntu-latest
        outputs:
            docs_only: ${{ steps.classify.outputs.docs_only }}
            desktop_changed: ${{ steps.classify.outputs.desktop_changed }}
        steps:
            - id: classify
              name: Detect docs-only pull requests
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
              with:
                  script: |
                      // merge_group must classify by base/head files; forcing desktop_changed=true
                      // made every queued PR (including actions/labeler, dependabot.yml) run Windows E2E.
                      if (
                        context.eventName !== 'pull_request' &&
                        context.eventName !== 'push' &&
                        context.eventName !== 'merge_group'
                      ) {
                        core.setOutput('docs_only', 'false');
                        core.setOutput('desktop_changed', 'true');
                        return;
                      }

                      const docsOnlyPatterns = [
                        /^docs\//,
                        /^[^/]+\.md$/,
                        /^COPYING$/,
                        /^\.github\/ISSUE_TEMPLATE\//,
                        /^\.github\/dependabot\.yml$/,
                        /^\.github\/labeler\.yml$/,
                        /^\.github\/labels\.yml$/,
                        /^\.github\/pull_request_template\.md$/,
                        /^CLAUDE\.md$/,
                        /^CODE_OF_CONDUCT\.md$/,
                        /^CONTRIBUTING\.md$/,
                        /^README\.en\.md$/,
                        /^README\.md$/,
                        /^SECURITY\.md$/,
                        /^SUPPORT\.md$/,
                      ];
                      const desktopPatterns = [
                        /^apps\/desktop\//,
                        /^packages\//,
                        /^package\.json$/,
                        /^pnpm-lock\.yaml$/,
                        /^pnpm-workspace\.yaml$/,
                        /^\.github\/workflows\/e2e-smoke\.yml$/,
                      ];

                      let files = [];

                      if (context.eventName === 'pull_request') {
                        files = await github.paginate(github.rest.pulls.listFiles, {
                          ...context.repo,
                          pull_number: context.issue.number,
                          per_page: 100,
                        });
                      } else if (context.eventName === 'push' || context.eventName === 'merge_group') {
                        const before =
                          context.eventName === 'merge_group'
                            ? context.payload.merge_group?.base_sha
                            : context.payload.before;
                        const after =
                          context.eventName === 'merge_group'
                            ? context.payload.merge_group?.head_sha
                            : context.payload.after;

                        if (!before || !after || /^0+$/.test(before)) {
                          core.setOutput('docs_only', 'false');
                          core.setOutput('desktop_changed', 'true');
                          return;
                        }

                        const comparison = await github.rest.repos.compareCommits({
                          ...context.repo,
                          base: before,
                          head: after,
                        });

                        files = comparison.data.files ?? [];

                        if (files.length >= 300) {
                          core.setOutput('docs_only', 'false');
                          core.setOutput('desktop_changed', 'true');
                          return;
                        }
                      }

                      const docsOnly =
                        files.length > 0 &&
                        files.every((file) => docsOnlyPatterns.some((pattern) => pattern.test(file.filename)));
                      const filenames = files.map((file) => file.filename);
                      const desktopChanged =
                        filenames.length === 0 ||
                        filenames.some((filename) => desktopPatterns.some((pattern) => pattern.test(filename)));

                      core.setOutput('docs_only', docsOnly ? 'true' : 'false');
                      core.setOutput('desktop_changed', desktopChanged ? 'true' : 'false');

            - name: Report classification
              run: |
                  echo "docs_only=${{ steps.classify.outputs.docs_only }}"
                  echo "desktop_changed=${{ steps.classify.outputs.desktop_changed }}"

    # The debug binary is the expensive part of the Windows suite: a from-scratch Tauri
    # build of the cargo workspace. Building it here, once, is what lets the smoke tests
    # and the visual comparison each run against the same artifact instead of paying for
    # their own copy — and it is what will let a second consumer of the binary be added
    # later without doubling the cost.
    #
    # The artifact is the built executable plus its bundled runtime resources, because the
    # app resolves those relative to itself at startup.
    build-windows:
        name: Build Windows binary
        needs: changes
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.desktop_changed == 'true'
        runs-on: windows-latest
        env:
            TOUCHAI_CARGO_TARGET_DIR: apps/desktop/src-tauri/target/e2e
            TOUCHAI_E2E_CARGO_PROFILE: ci-check
            # `wdio.conf.js` sets this itself for the build it runs; it is set here too so
            # the build in this job and the test job that consumes it place the binary in
            # exactly the same directory.
            CARGO_TARGET_DIR: apps/desktop/src-tauri/target/e2e
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  package-manager-cache: false

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

            - name: Rust cache
              uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with:
                  workspaces: apps/desktop/src-tauri -> target/e2e

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Build the debug binary
              shell: pwsh
              run: |
                  # The same invocation `wdio.conf.js` uses in `onPrepare`: from the
                  # repository root, through pnpm, because `tauri` is a workspace script
                  # rather than a binary on PATH. `--profile` has to reach cargo, hence the
                  # `--` before it.
                  pnpm tauri build --debug --no-bundle -- --profile ci-check
                  if ($LASTEXITCODE -ne 0) {
                      throw "The Tauri debug build failed with exit code $LASTEXITCODE."
                  }

            - name: Upload the binary
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: desktop-debug-binary
                  # `bundle.resources` is empty in `tauri.conf.json`, so the executable is
                  # the whole artifact. The glob is used rather than a fixed path because
                  # the profile directory name follows `--profile`, and pinning it here
                  # would break the moment the profile changes.
                  path: apps/desktop/src-tauri/target/e2e/*/TouchAI.exe
                  if-no-files-found: error
                  retention-days: 1

    desktop-e2e-smoke-windows:
        name: Desktop E2E Smoke (Windows)
        needs: [changes, build-windows]
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.desktop_changed == 'true'
        runs-on: windows-latest
        env:
            TOUCHAI_CARGO_TARGET_DIR: apps/desktop/src-tauri/target/e2e
            TOUCHAI_E2E_CARGO_PROFILE: ci-check
            # The build already happened in `build-windows`; rebuilding it here would
            # double the most expensive step in the workflow.
            TOUCHAI_E2E_SKIP_BUILD: '1'
            # WebView2 150+ on GHA Windows needs explicit remote debugging for tauri-driver.
            WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --remote-debugging-port=9222 --enable-features=msEdgeDevToolsWdpRemoteDebugging --disable-gpu --no-sandbox --disable-dev-shm-usage
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  package-manager-cache: false

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

            - name: Download the binary
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: desktop-debug-binary
                  path: apps/desktop/src-tauri/target/e2e/ci-check

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Install tauri-driver
              run: cargo install tauri-driver --locked

            - name: Configure Edge WebDriver
              shell: pwsh
              run: |
                  $applicationRoots = @()
                  if (${env:ProgramFiles(x86)}) {
                    $applicationRoots += Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'
                  }

                  if ($env:ProgramFiles) {
                    $applicationRoots += Join-Path $env:ProgramFiles 'Microsoft\EdgeWebView\Application'
                  }

                  $runtime = $applicationRoots |
                    Where-Object { Test-Path -LiteralPath $_ } |
                    ForEach-Object { Get-ChildItem -LiteralPath $_ -Directory } |
                    Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
                    Sort-Object { [version]$_.Name } -Descending |
                    Select-Object -First 1

                  if (-not $runtime) {
                    throw "Microsoft Edge WebView2 runtime version directory was not found."
                  }

                  $driverVersion = $runtime.Name
                  $toolsDir = Join-Path $env:RUNNER_TEMP 'touchai-edgedriver'
                  $archivePath = Join-Path $toolsDir 'edgedriver_win64.zip'
                  $driverDir = Join-Path $toolsDir $driverVersion
                  $driverPath = Join-Path $driverDir 'msedgedriver.exe'
                  $downloadUrl = "https://msedgedriver.microsoft.com/$driverVersion/edgedriver_win64.zip"

                  New-Item -ItemType Directory -Force -Path $toolsDir, $driverDir | Out-Null
                  Invoke-WebRequest -UseBasicParsing -Uri $downloadUrl -OutFile $archivePath
                  Expand-Archive -LiteralPath $archivePath -DestinationPath $driverDir -Force

                  if (-not (Test-Path -LiteralPath $driverPath)) {
                    throw "msedgedriver.exe was not found after extracting $archivePath"
                  }

                  Write-Host "Using Microsoft Edge WebView2 runtime $driverVersion"
                  Write-Host "WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS=$env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS"
                  & $driverPath --version
                  "TOUCHAI_MSEDGEDRIVER_PATH=$driverPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            - name: Run desktop smoke tests
              id: tests
              if: ${{ !inputs.update_visual_baselines }}
              run: pnpm test:e2e

            # Baselines are rendered by the runner that gates the PR, so the pixels
            # match the comparison environment. Regenerating them on a developer
            # machine bakes that machine's DPI and font rasterisation into the files.
            - name: Regenerate visual baselines
              if: ${{ inputs.update_visual_baselines }}
              run: pnpm --filter @touchai/desktop test:e2e:visual:update

            # A failing comparison leaves the actual and diff images under
            # `.e2e-runtime/visual`, which is deleted with the runner. They have to reach
            # the reviewer, so they are gathered here first. The service names all three
            # images after the baseline, and a report needs them side by side, so each
            # copy is renamed with the same `-expected` / `-actual` / `-diff` suffix the
            # component layer uses — that is also the name the report looks up.
            - name: Gather the diff images
              if: ${{ !cancelled() && !inputs.update_visual_baselines }}
              shell: pwsh
              run: |
                  $imagesDir = Join-Path $env:RUNNER_TEMP 'visual-diffs'
                  $visualRoot = Join-Path $env:GITHUB_WORKSPACE '.e2e-runtime/visual'
                  $baselineDir = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/e2e-tests/__snapshots__'

                  Remove-Item -LiteralPath $imagesDir -Recurse -Force -ErrorAction SilentlyContinue
                  New-Item -ItemType Directory -Force -Path $imagesDir | Out-Null

                  $diffDir = Join-Path $visualRoot 'diff'
                  $diffs = @()
                  if (Test-Path -LiteralPath $diffDir) {
                      $diffs = @(Get-ChildItem -LiteralPath $diffDir -Filter '*.png' -File)
                  }

                  foreach ($diff in $diffs) {
                      $stem = $diff.BaseName
                      Copy-Item -LiteralPath $diff.FullName -Destination (Join-Path $imagesDir "$stem-diff.png")

                      $actual = Join-Path $visualRoot "actual/$($diff.Name)"
                      if (Test-Path -LiteralPath $actual) {
                          Copy-Item -LiteralPath $actual -Destination (Join-Path $imagesDir "$stem-actual.png")
                      }

                      $baseline = Join-Path $baselineDir $diff.Name
                      if (Test-Path -LiteralPath $baseline) {
                          Copy-Item -LiteralPath $baseline -Destination (Join-Path $imagesDir "$stem-expected.png")
                      }
                  }

                  Write-Host "collected $($diffs.Count) snapshot(s)."

            # The same upload the component layer uses, for the same reasons: an artifact
            # needs authentication, so a markdown image pointing at it renders nothing,
            # and GitHub's attachment store is the one place that serves these publicly.
            # Without `UI_PREVIEW_TOKEN` — a fork pull request, or a repository that has
            # not configured it — nothing is uploaded and the report links the artifact
            # instead, which is a worse report rather than a failed run.
            - name: Publish the diff images
              id: publish
              if: ${{ !cancelled() && !inputs.update_visual_baselines }}
              working-directory: apps/desktop
              env:
                  UI_PREVIEW_TOKEN: ${{ secrets.UI_PREVIEW_TOKEN }}
                  UI_PREVIEW_REPOSITORY_ID: ${{ github.event.repository.id }}
                  VISUAL_EVIDENCE_URLS: ${{ runner.temp }}/visual-evidence.json
              run: node ./scripts/ci/publish-evidence.mjs "${{ runner.temp }}/visual-diffs" "${{ runner.temp }}/visual-evidence.json"

            # The report section for this layer. `visual-comment.mjs` merges it into the
            # one pull request comment that also holds the component layer's section.
            - name: Summarise the visual differences
              if: ${{ !cancelled() && !inputs.update_visual_baselines }}
              working-directory: apps/desktop
              env:
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  VISUAL_SUMMARY_OUTPUT: ${{ runner.temp }}/visual-summary.md
                  VISUAL_EVIDENCE_URLS: ${{ runner.temp }}/visual-evidence.json
                  VISUAL_TESTS_OUTCOME: ${{ steps.tests.outcome }}
              run: node ./scripts/ci/visual-report.mjs --layer e2e --diff-dir "${{ github.workspace }}/.e2e-runtime/visual/diff" --baseline-dir "${{ github.workspace }}/apps/desktop/e2e-tests/__snapshots__" --actual-dir "${{ github.workspace }}/.e2e-runtime/visual/actual"

            # Minted rather than derived from `GITHUB_TOKEN`, because the comment has to
            # be written by the App: the pull request's own token is read-only for fork
            # runs, and `github-actions` cannot author the attachment URLs the report
            # embeds. The `if:` keeps the token away from fork code, since the App can
            # write anywhere it is installed.
            - name: Mint an App token
              id: app
              if: |
                  !cancelled() &&
                  !inputs.update_visual_baselines &&
                  github.event_name == 'pull_request' &&
                  github.event.pull_request.head.repo.full_name == github.repository
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  app-id: ${{ secrets.BOT_APP_ID }}
                  private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}
                  repositories: ${{ github.event.repository.name }}
                  permission-pull-requests: write
                  permission-issues: write

            - name: Post the report on the pull request
              if: steps.app.outputs.token != ''
              env:
                  GH_TOKEN: ${{ steps.app.outputs.token }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  LAYER: e2e
                  SECTION_PATH: ${{ runner.temp }}/visual-summary.md
              run: node apps/desktop/scripts/ci/visual-comment.mjs

            - name: Upload visual baselines
              if: ${{ inputs.update_visual_baselines }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: visual-baselines
                  path: apps/desktop/e2e-tests/__snapshots__/
                  if-no-files-found: error

            - name: Upload diff artifacts
              if: ${{ failure() && !inputs.update_visual_baselines }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: app-visual-diffs
                  path: ${{ runner.temp }}/visual-diffs/
                  if-no-files-found: ignore

    e2e-required:
        name: E2E Required
        if: always()
        needs:
            - changes
            - desktop-e2e-smoke-windows
        runs-on: ubuntu-latest
        steps:
            - name: Verify required E2E jobs
              env:
                  DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
                  DESKTOP_CHANGED: ${{ needs.changes.outputs.desktop_changed }}
                  CHANGES_RESULT: ${{ needs.changes.result }}
                  BUILD_RESULT: ${{ needs.build-windows.result }}
                  DESKTOP_E2E_RESULT: ${{ needs['desktop-e2e-smoke-windows'].result }}
              run: |
                  required=("changes:$CHANGES_RESULT")

                  if [ "$DOCS_ONLY" != "true" ] && [ "$DESKTOP_CHANGED" = "true" ]; then
                    required+=("build-windows:$BUILD_RESULT")
                    required+=("desktop-e2e-smoke-windows:$DESKTOP_E2E_RESULT")
                  fi

                  failed=0
                  observed=(
                    "changes:$CHANGES_RESULT"
                    "build-windows:$BUILD_RESULT"
                    "desktop-e2e-smoke-windows:$DESKTOP_E2E_RESULT"
                  )

                  for check in "${observed[@]}"; do
                    name="${check%%:*}"
                    result="${check#*:}"

                    if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
                      echo "$name unexpectedly ended with $result."
                      failed=1
                    fi
                  done

                  for check in "${required[@]}"; do
                    name="${check%%:*}"
                    result="${check#*:}"
                    echo "$name -> $result"

                    if [ "$result" != "success" ]; then
                      failed=1
                    fi
                  done

                  if [ "$failed" -ne 0 ]; then
                    echo "One or more required E2E jobs did not pass."
                    exit 1
                  fi
