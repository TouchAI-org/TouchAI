name: Security

# Measure database preparation separately from security-query execution.
on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        - cron: '0 5 * * 1'
    workflow_dispatch:

permissions:
    contents: read
    security-events: write

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    changes:
        name: Classify PR changes
        runs-on: ubuntu-latest
        outputs:
            docs_only: ${{ steps.classify.outputs.docs_only }}
            rust_changed: ${{ steps.classify.outputs.rust_changed }}
        steps:
            - id: classify
              name: Detect docs-only and Rust changes
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
              with:
                  script: |
                      // CodeQL on Rust is the slowest check in the repository: it builds the
                      // cargo workspace and then analyses the whole crate, which takes about
                      // half an hour on a Windows runner. Most changes touch none of it, so
                      // the language is analysed only when its own sources moved.
                      //
                      // This does not weaken the gate. Rust that did change is analysed in
                      // full, exactly as before; what is skipped is re-scanning code that is
                      // byte-identical to what was scanned on the previous commit. The weekly
                      // schedule still analyses everything unconditionally, so anything that
                      // slipped through here is caught there.
                      const rustPatterns = [
                        /^apps\/desktop\/src-tauri\/.*\.rs$/,
                        /^apps\/desktop\/src-tauri\/Cargo\.(?:toml|lock)$/,
                        /^apps\/desktop\/src-tauri\/build\.rs$/,
                        /^apps\/desktop\/src-tauri\/\.cargo\//,
                        /^apps\/desktop\/src-tauri\/rust-toolchain(?:\.toml)?$/,
                        /^apps\/desktop\/src-tauri\/(?:vendor|resources|capabilities|icons|wix)\//,
                        /^apps\/desktop\/src-tauri\/windows-common-controls\.manifest$/,
                        /^apps\/desktop\/src-tauri\/tauri\.conf\.json$/,
                        /^apps\/desktop\/product\.json$/,
                        /^apps\/desktop\/src\/database\/(?:drizzle|artifacts)\//,
                        /^\.cargo\//,
                        /^Cargo\.(?:toml|lock)$/,
                        /^rust-toolchain(?:\.toml)?$/,
                        /^\.github\/workflows\/security\.yml$/,
                      ];

                      const setOutputs = (docsOnly, rustChanged) => {
                        core.setOutput('docs_only', docsOnly);
                        core.setOutput('rust_changed', rustChanged);
                      };

                      // A scheduled or manually dispatched run is the safety net, so it
                      // analyses everything regardless of what changed.
                      if (context.eventName !== 'pull_request' && context.eventName !== 'push') {
                        setOutputs('false', 'true');
                        return;
                      }

                      // The classification below reads a file list. Whenever that list is
                      // unavailable or truncated, the answer has to be "assume yes": an
                      // empty list would otherwise look like "nothing changed" and silently
                      // skip the analysis.
                      const releaseNotesPattern =
                        /^apps\/desktop\/release-notes\/[^/]+\.json$/;
                      const docsOnlyPatterns = [
                        /^docs\//,
                        /^[^/]+\.md$/,
                        /^COPYING$/,
                        /^\.github\/ISSUE_TEMPLATE\//,
                        /^\.github\/dependabot\.yml$/,
                        /^\.github\/labeler\.yml$/,
                        /^\.github\/labels\.yml$/,
                        /^\.github\/pull_request_template\.md$/,
                        /^CLAUDE\.md$/,
                        /^CODE_OF_CONDUCT\.md$/,
                        /^CONTRIBUTING\.md$/,
                        /^README\.en\.md$/,
                        /^README\.md$/,
                        /^SECURITY\.md$/,
                        /^SUPPORT\.md$/,
                        releaseNotesPattern,
                      ];

                      let files = [];

                      if (context.eventName === 'pull_request') {
                        files = await github.paginate(github.rest.pulls.listFiles, {
                          ...context.repo,
                          pull_number: context.issue.number,
                          per_page: 100,
                        });
                      } else if (context.eventName === 'push') {
                        const before = context.payload.before;
                        const after = context.payload.after;

                        if (!before || !after || /^0+$/.test(before)) {
                          setOutputs('false', 'true');
                          return;
                        }

                        const comparison = await github.rest.repos.compareCommits({
                          ...context.repo,
                          base: before,
                          head: after,
                        });

                        files = comparison.data.files ?? [];

                        // GitHub truncates compareCommits file lists at 300 entries. Fall back to full CI when unsure.
                        if (!Array.isArray(files) || files.length >= 300) {
                          setOutputs('false', 'true');
                          return;
                        }
                      }

                      // An empty list means the API gave nothing to look at, not that the
                      // change was empty.
                      if (!Array.isArray(files) || files.length === 0) {
                        setOutputs('false', 'true');
                        return;
                      }

                      if (context.eventName === 'pull_request') {
                        const expectedCount = context.payload.pull_request?.changed_files;

                        if (
                          files.length >= 3000 ||
                          (Number.isInteger(expectedCount) && expectedCount !== files.length)
                        ) {
                          setOutputs('false', 'true');
                          return;
                        }
                      }

                      const validFilename = (value) =>
                        typeof value === 'string' && value.trim().length > 0;
                      const validFiles = files.every((file) => {
                        if (file === null || typeof file !== 'object') {
                          return false;
                        }

                        const hasPrevious = Object.prototype.hasOwnProperty.call(
                          file,
                          'previous_filename'
                        );

                        return (
                          validFilename(file.filename) &&
                          (!hasPrevious || validFilename(file.previous_filename)) &&
                          (file.status !== 'renamed' || validFilename(file.previous_filename))
                        );
                      });

                      if (!validFiles) {
                        setOutputs('false', 'true');
                        return;
                      }

                      const filenames = files.flatMap((file) =>
                        file.previous_filename
                          ? [file.filename, file.previous_filename]
                          : [file.filename]
                      );
                      const docsOnly = filenames.every((filename) =>
                        docsOnlyPatterns.some((pattern) => pattern.test(filename))
                      );
                      const rustChanged = filenames.some((filename) =>
                        rustPatterns.some((pattern) => pattern.test(filename))
                      );

                      setOutputs(docsOnly ? 'true' : 'false', rustChanged ? 'true' : 'false');

            - name: Report classification
              run: echo "docs_only=${{ steps.classify.outputs.docs_only }} rust_changed=${{ steps.classify.outputs.rust_changed }}"

    codeql:
        name: CodeQL (${{ matrix.language }})
        needs: changes
        # The Rust analysis costs about half an hour, so it runs only when Rust moved.
        # JavaScript and TypeScript are cheap, so they always run. `docs_only` still
        # short-circuits both, as before.
        #
        # The check is repeated on every step rather than written once as a job-level
        # `if:`: `matrix` is not available while a job's condition is evaluated, so the
        # language cannot be named there. A skipped job would also report nothing at all,
        # whereas these steps leave a readable "skipped" trace on the run.
        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: javascript-typescript
                      os: ubuntu-latest
                    - language: rust
                      os: windows-latest
        runs-on: ${{ matrix.os }}
        steps:
            - name: Decide whether this language has to be analysed
              id: gate
              # The Rust entry of the matrix runs on a Windows runner, where the default
              # shell is PowerShell and the `[ ... ]` tests below are not syntax it knows.
              shell: bash
              env:
                  DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
                  RUST_CHANGED: ${{ needs.changes.outputs.rust_changed }}
                  LANGUAGE: ${{ matrix.language }}
              run: |
                  if [ "$DOCS_ONLY" = 'true' ]; then
                      echo "run=false" >> "$GITHUB_OUTPUT"
                      echo "CodeQL is not required for docs-only pull requests ($LANGUAGE)."
                      exit 0
                  fi

                  if [ "$LANGUAGE" = 'rust' ] && [ "$RUST_CHANGED" != 'true' ]; then
                      echo "run=false" >> "$GITHUB_OUTPUT"
                      echo "No Rust sources changed, so the Rust analysis is skipped. It takes about half an hour, and the code it would scan is identical to the last commit that did touch it."
                      exit 0
                  fi

                  echo "run=true" >> "$GITHUB_OUTPUT"

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              if: steps.gate.outputs.run == 'true'

            - name: Initialize CodeQL
              if: steps.gate.outputs.run == 'true'
              uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
              with:
                  languages: ${{ matrix.language }}

            - name: Set up pnpm
              if: steps.gate.outputs.run == 'true' && matrix.language == 'rust'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

            - name: Set up Node
              if: steps.gate.outputs.run == 'true' && matrix.language == 'rust'
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  package-manager-cache: false

            - name: Install Rust stable
              if: steps.gate.outputs.run == 'true' && matrix.language == 'rust'
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

            # The build below is a from-scratch compile of the whole cargo workspace on
            # every run, and it dominates the job. The cache is keyed on the manifests and
            # the toolchain rather than on the sources, because a cache that missed on any
            # source edit would almost never hit: `cargo check` reuses the dependency graph
            # regardless of what changed in this crate.
            - name: Rust cache
              if: steps.gate.outputs.run == 'true' && matrix.language == 'rust'
              uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with:
                  # The same directory `CI` writes to, so a checkout that ran the Rust
                  # checks already has warm artifacts to hand.
                  workspaces: apps/desktop/src-tauri -> ../../../rust-target/ci-check
                  shared-key: codeql-rust
                  # Only main may write the cache: a pull request that filled it would let
                  # another pull request run against artifacts it never produced.
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            - name: Install dependencies
              if: steps.gate.outputs.run == 'true' && matrix.language == 'rust'
              run: pnpm install --frozen-lockfile

            - name: Build Rust targets for analysis
              if: steps.gate.outputs.run == 'true' && matrix.language == 'rust'
              env:
                  CARGO_TARGET_DIR: rust-target/ci-check
              run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --profile ci-check

            - name: Analyze
              if: steps.gate.outputs.run == 'true'
              uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

    audits:
        name: Dependency audits
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Audit npm dependencies
              run: pnpm audit --prod --audit-level high

            - name: Install cargo-audit
              env:
                  CARGO_AUDIT_VERSION: 0.22.2
                  CARGO_AUDIT_SHA256: ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39
                  CARGO_AUDIT_MEMBER: cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit
              run: |
                  set -euo pipefail
                  archive="$RUNNER_TEMP/cargo-audit.tgz"
                  extract_dir="$RUNNER_TEMP/cargo-audit-extracted"
                  curl --fail --silent --show-error --location \
                    "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${CARGO_AUDIT_VERSION}/cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}.tgz" \
                    --output "$archive"
                  printf '%s  %s\n' "$CARGO_AUDIT_SHA256" "$archive" | sha256sum --check -
                  rm -rf "$extract_dir"
                  mkdir -p "$extract_dir" "$HOME/.cargo/bin"
                  tar -xzf "$archive" -C "$extract_dir" "$CARGO_AUDIT_MEMBER"
                  install -m 0755 "$extract_dir/$CARGO_AUDIT_MEMBER" "$HOME/.cargo/bin/cargo-audit"
                  cargo-audit --version

            - name: Audit Rust dependencies
              run: cargo-audit audit --file apps/desktop/src-tauri/Cargo.lock
