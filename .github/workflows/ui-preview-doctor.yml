name: UI Preview Doctor

on:
    workflow_dispatch:

permissions: {}

jobs:
    model:
        name: Model credential
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        environment: ui-preview
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false
                  sparse-checkout: |
                      .github/ui-preview
                  sparse-checkout-cone-mode: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  package-manager-cache: false

            - name: Check the model
              env:
                  UI_PREVIEW_MODEL_API_KEY: ${{ secrets.UI_PREVIEW_MODEL_API_KEY }}
                  UI_PREVIEW_MODEL_BASE_URL: ${{ vars.UI_PREVIEW_MODEL_BASE_URL }}
                  UI_PREVIEW_MODEL: ${{ vars.UI_PREVIEW_MODEL }}
              run: node .github/ui-preview/doctor.mjs --mode=model

    publish:
        name: Publish credentials
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        environment: ui-preview-publish
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false
                  sparse-checkout: |
                      .github/ui-preview
                  sparse-checkout-cone-mode: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  package-manager-cache: false

            - name: Mint the comment token
              id: app
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  app-id: ${{ secrets.BOT_APP_ID }}
                  private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}
                  repositories: ${{ github.event.repository.name }}
                  permission-issues: write
                  permission-pull-requests: write

            - name: Check the App and upload credentials
              env:
                  GH_TOKEN: ${{ steps.app.outputs.token }}
                  UI_PREVIEW_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
                  ATTACHMENT_TOKEN: ${{ secrets.ATTACHMENT_TOKEN }}
                  UI_PREVIEW_REPOSITORY_ID: ${{ github.event.repository.id }}
              run: node .github/ui-preview/doctor.mjs --mode=publish
