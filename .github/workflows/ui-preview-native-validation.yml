name: UI Preview Native Validation

on:
    pull_request:
        types:
            - labeled

permissions:
    contents: read
    pull-requests: read

env:
    UI_PREVIEW_DESKTOP_COLOUR: '#d9d4c8'

jobs:
    outline:
        name: Build and outline (${{ matrix.platform }})
        if: github.event.label.name == 'ui-preview-native-validation'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux
                      os: ubuntu-24.04
                      binary: TouchAI
                    - platform: macos
                      os: macos-15
                      binary: TouchAI
                    - platform: windows
                      os: windows-latest
                      binary: TouchAI.exe
        runs-on: ${{ matrix.os }}
        timeout-minutes: 90
        permissions:
            contents: read
        env:
            CARGO_TARGET_DIR: ${{ github.workspace }}/.ui-preview-target
            TOUCHAI_E2E: '1'
            UI_PREVIEW_PLATFORM: ${{ matrix.platform }}
        steps:
            - name: Check out the pull request
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  package-manager-cache: false

            - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

            - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with:
                  workspaces: apps/desktop/src-tauri -> ../../../.ui-preview-target

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Linux dependencies
              if: matrix.platform == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    build-essential \
                    curl \
                    feh \
                    file \
                    fonts-noto-cjk \
                    imagemagick \
                    libayatana-appindicator3-dev \
                    libglib2.0-dev \
                    librsvg2-dev \
                    libssl-dev \
                    libwebkit2gtk-4.1-dev \
                    libxdo-dev \
                    openbox \
                    picom \
                    pkg-config \
                    wget \
                    x11-utils \
                    x11-xserver-utils \
                    xdotool \
                    xvfb

            - name: Configure the hosted display (macOS)
              if: matrix.platform == 'macos'
              run: |
                  swift .github/ui-preview/macos-display.swift --list
                  swift .github/ui-preview/macos-display.swift --configure-hosted

            - name: Configure the hosted display (Windows)
              if: matrix.platform == 'windows'
              shell: pwsh
              run: |
                  ./.github/ui-preview/configure-display.ps1 -List
                  ./.github/ui-preview/configure-display.ps1

            - name: Build the desktop app
              run: pnpm tauri build --debug --no-bundle --features ui-preview-webdriver

            - name: Collect the outline
              if: matrix.platform != 'linux'
              env:
                  UI_PREVIEW_APP_BINARY: ${{ env.CARGO_TARGET_DIR }}/debug/${{ matrix.binary }}
                  UI_PREVIEW_OUT: ${{ github.workspace }}/ui-preview-out
                  UI_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
                  UI_PREVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  TOUCHAI_APP_ROOT: ${{ runner.temp }}/ui-preview-app-root
              run: node .github/ui-preview/explore.mjs

            - name: Collect the outline (Linux)
              if: matrix.platform == 'linux'
              env:
                  UI_PREVIEW_APP_BINARY: ${{ env.CARGO_TARGET_DIR }}/debug/${{ matrix.binary }}
                  UI_PREVIEW_OUT: ${{ github.workspace }}/ui-preview-out
                  UI_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
                  UI_PREVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  UI_PREVIEW_DISPLAY_WIDTH: '1920'
                  UI_PREVIEW_DISPLAY_HEIGHT: '1080'
                  UI_PREVIEW_STAGE_WIDTH: '1920'
                  UI_PREVIEW_STAGE_HEIGHT: '1080'
                  UI_PREVIEW_STAGE_TOP: '40'
                  UI_PREVIEW_SCALE_FACTOR: '1'
                  TOUCHAI_APP_ROOT: ${{ runner.temp }}/ui-preview-app-root
              run: |
                  xvfb-run -a --server-args='-screen 0 1920x1080x24' \
                    .github/ui-preview/with-display.sh \
                    node .github/ui-preview/explore.mjs

            - name: Stage the build and facts (Linux and macOS)
              if: matrix.platform != 'windows'
              run: |
                  mkdir -p ui-preview-build
                  cp "$CARGO_TARGET_DIR/debug/${{ matrix.binary }}" ui-preview-build/
                  cp ui-preview-out/facts.json ui-preview-build/
                  if [ -f ui-preview-out/baseline-search.png ]; then
                    cp ui-preview-out/baseline-search.png ui-preview-build/
                  fi

            - name: Stage the build and facts (Windows)
              if: matrix.platform == 'windows'
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force ui-preview-build | Out-Null
                  Copy-Item "$env:CARGO_TARGET_DIR/debug/${{ matrix.binary }}" ui-preview-build/
                  Copy-Item ui-preview-out/facts.json ui-preview-build/
                  if (Test-Path ui-preview-out/baseline-search.png) {
                    Copy-Item ui-preview-out/baseline-search.png ui-preview-build/
                  }

            - name: Upload the build and facts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ui-preview-native-build-${{ matrix.platform }}
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 3
                  path: ui-preview-build

    plan:
        name: Plan the preview
        needs:
            - outline
        # One plan is shared by all three recorders. Linux facts are the
        # planning input, exactly as in the production workflow.
        if: >-
            always() &&
            github.event.label.name == 'ui-preview-native-validation' &&
            needs.outline.result != 'cancelled'
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        # The protected ui-preview environment only accepts the default branch,
        # while this validation run uses a pull-request merge ref. The job is
        # label-gated and validation-only, so it reads the repository-level
        # model key instead of deploying the environment.
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Check out the validation scripts
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              continue-on-error: true
              with:
                  name: ui-preview-native-build-linux
                  path: ui-preview-out

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  package-manager-cache: false

            - name: Plan the preview
              env:
                  GH_TOKEN: ${{ github.token }}
                  UI_PREVIEW_OUT: ${{ github.workspace }}/ui-preview-out
                  UI_PREVIEW_PR: ${{ github.event.pull_request.number }}
                  UI_PREVIEW_MODEL_API_KEY: ${{ secrets.UI_PREVIEW_MODEL_API_KEY }}
                  UI_PREVIEW_MODEL_BASE_URL: ${{ vars.UI_PREVIEW_MODEL_BASE_URL }}
                  UI_PREVIEW_MODEL: ${{ vars.UI_PREVIEW_MODEL }}
              run: node .github/ui-preview/plan.mjs

            - name: Upload the plan
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ui-preview-native-plan
                  if-no-files-found: error
                  retention-days: 3
                  path: ui-preview-out/plan.json

    record:
        name: Record (${{ matrix.platform }})
        needs:
            - outline
            - plan
        if: >-
            always() &&
            github.event.label.name == 'ui-preview-native-validation' &&
            needs.plan.result == 'success' &&
            needs.outline.result != 'cancelled'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux
                      os: ubuntu-24.04
                      binary: TouchAI
                    - platform: macos
                      os: macos-15
                      binary: TouchAI
                    - platform: windows
                      os: windows-latest
                      binary: TouchAI.exe
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        permissions:
            contents: read
        env:
            TOUCHAI_E2E: '1'
            UI_PREVIEW_PLATFORM: ${{ matrix.platform }}
        steps:
            - name: Check out the validation scripts
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: ui-preview-native-build-${{ matrix.platform }}
                  path: ui-preview-out

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: ui-preview-native-plan
                  path: ui-preview-out

            - name: Install Linux recording dependencies
              if: matrix.platform == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    ffmpeg \
                    feh \
                    fonts-noto-cjk \
                    imagemagick \
                    libayatana-appindicator3-1 \
                    libwebkit2gtk-4.1-0 \
                    openbox \
                    picom \
                    x11-utils \
                    x11-xserver-utils \
                    xdotool \
                    xvfb

            - name: Install macOS recording dependencies
              if: matrix.platform == 'macos'
              run: |
                  brew install ffmpeg
                  # The current Homebrew ffmpeg bottle no longer links libass,
                  # so the caption pass silently fell back on macOS. ffmpeg@7
                  # still ships the ass filter; point the recorder at it when
                  # the filter is really there.
                  brew install ffmpeg@7
                  ffmpeg7="$(brew --prefix ffmpeg@7)/bin/ffmpeg"
                  if "$ffmpeg7" -hide_banner -filters 2>/dev/null | grep -q ' ass '; then
                    echo "UI_PREVIEW_FFMPEG=$ffmpeg7" >> "$GITHUB_ENV"
                    echo "UI_PREVIEW_FFPROBE=$(brew --prefix ffmpeg@7)/bin/ffprobe" >> "$GITHUB_ENV"
                  else
                    echo "::warning::ffmpeg@7 has no ass filter; captions will fall back"
                  fi

            - name: Install Windows recording dependencies
              if: matrix.platform == 'windows'
              shell: pwsh
              run: |
                  if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
                    choco install ffmpeg -y --no-progress
                  }
                  ffmpeg -version | Select-Object -First 1

            - name: Configure the hosted display (macOS)
              if: matrix.platform == 'macos'
              run: |
                  swift .github/ui-preview/macos-display.swift --list
                  swift .github/ui-preview/macos-display.swift --configure-hosted

            - name: Configure the hosted display (Windows)
              if: matrix.platform == 'windows'
              shell: pwsh
              run: |
                  ./.github/ui-preview/configure-display.ps1 -List
                  ./.github/ui-preview/configure-display.ps1

            - name: Hide the runner console (Windows)
              if: matrix.platform == 'windows'
              shell: pwsh
              run: |
                  Add-Type -TypeDefinition @"
                  using System;
                  using System.Runtime.InteropServices;
                  public static class PreviewWindow {
                      [DllImport("user32.dll")]
                      public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
                  }
                  "@
                  Get-Process |
                    Where-Object {
                      $_.MainWindowHandle -ne 0 -and
                      ($_.MainWindowTitle -match 'GitHub Actions|ProgramData|PowerShell|Command Prompt|System Properties|Server Manager')
                    } |
                    ForEach-Object { [PreviewWindow]::ShowWindow($_.MainWindowHandle, 0) | Out-Null }

            - name: Record the native preview (Linux)
              if: matrix.platform == 'linux'
              env:
                  UI_PREVIEW_APP_BINARY: ${{ github.workspace }}/ui-preview-out/${{ matrix.binary }}
                  UI_PREVIEW_OUT: ${{ github.workspace }}/ui-preview-out
                  UI_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
                  UI_PREVIEW_PR: ${{ github.event.pull_request.number }}
                  UI_PREVIEW_TITLE: ${{ github.event.pull_request.title }}
                  UI_PREVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  UI_PREVIEW_TRIGGER: native validation
                  UI_PREVIEW_SEED: '1'
                  UI_PREVIEW_DISPLAY_WIDTH: '1920'
                  UI_PREVIEW_DISPLAY_HEIGHT: '1080'
                  UI_PREVIEW_STAGE_WIDTH: '1920'
                  UI_PREVIEW_STAGE_HEIGHT: '1080'
                  UI_PREVIEW_STAGE_TOP: '40'
                  UI_PREVIEW_SCALE_FACTOR: '1'
                  TOUCHAI_UI_PREVIEW: '1'
                  TOUCHAI_APP_ROOT: ${{ runner.temp }}/ui-preview-app-root
              run: |
                  chmod +x ui-preview-out/TouchAI
                  xvfb-run -a --server-args='-screen 0 1920x1080x24' \
                    .github/ui-preview/with-display.sh node .github/ui-preview/record.mjs

            - name: Record the native preview (macOS)
              if: matrix.platform == 'macos'
              env:
                  UI_PREVIEW_APP_BINARY: ${{ github.workspace }}/ui-preview-out/${{ matrix.binary }}
                  UI_PREVIEW_OUT: ${{ github.workspace }}/ui-preview-out
                  UI_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
                  UI_PREVIEW_PR: ${{ github.event.pull_request.number }}
                  UI_PREVIEW_TITLE: ${{ github.event.pull_request.title }}
                  UI_PREVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  UI_PREVIEW_TRIGGER: native validation
                  UI_PREVIEW_SEED: '1'
                  TOUCHAI_UI_PREVIEW: '1'
                  TOUCHAI_APP_ROOT: ${{ runner.temp }}/ui-preview-app-root
              run: |
                  chmod +x ui-preview-out/TouchAI
                  node .github/ui-preview/record.mjs

            - name: Record the native preview (Windows)
              if: matrix.platform == 'windows'
              shell: pwsh
              env:
                  UI_PREVIEW_APP_BINARY: ${{ github.workspace }}/ui-preview-out/${{ matrix.binary }}
                  UI_PREVIEW_OUT: ${{ github.workspace }}/ui-preview-out
                  UI_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
                  UI_PREVIEW_PR: ${{ github.event.pull_request.number }}
                  UI_PREVIEW_TITLE: ${{ github.event.pull_request.title }}
                  UI_PREVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  UI_PREVIEW_TRIGGER: native validation
                  UI_PREVIEW_SEED: '1'
                  TOUCHAI_UI_PREVIEW: '1'
                  TOUCHAI_APP_ROOT: ${{ runner.temp }}/ui-preview-app-root
              run: node .github/ui-preview/record.mjs

            - name: Upload evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ui-preview-native-validation-${{ matrix.platform }}
                  if-no-files-found: warn
                  retention-days: 14
                  path: |
                      ui-preview-out/manifest.json
                      ui-preview-out/evidence

    publish:
        name: Publish the validation comment
        needs:
            - record
        # Validation-only: maintainers add the label after review, and the
        # publisher runs the scripts from the same branch it just recorded.
        # The production trigger is ui-preview.yml, which never runs head code
        # in a job that holds a token.
        if: >-
            always() &&
            github.event.label.name == 'ui-preview-native-validation' &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Check out the validation scripts
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              continue-on-error: true
              with:
                  pattern: ui-preview-native-validation-*
                  path: ui-preview-out/platforms
                  merge-multiple: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  package-manager-cache: false

            - name: Mint the App token
              id: app
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  app-id: ${{ secrets.BOT_APP_ID }}
                  private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}
                  repositories: ${{ github.event.repository.name }}
                  permission-issues: write
                  permission-pull-requests: write

            - name: Publish the comment as the App
              env:
                  GH_TOKEN: ${{ steps.app.outputs.token }}
                  UI_PREVIEW_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
                  ATTACHMENT_TOKEN: ${{ secrets.ATTACHMENT_TOKEN }}
                  UI_PREVIEW_OUT: ${{ github.workspace }}/ui-preview-out
                  UI_PREVIEW_PLATFORMS: linux,macos,windows
                  UI_PREVIEW_PR: ${{ github.event.pull_request.number }}
                  UI_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
                  UI_PREVIEW_TRIGGER: native validation
                  UI_PREVIEW_REPOSITORY_ID: ${{ github.event.repository.id }}
                  UI_PREVIEW_ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
              run: node .github/ui-preview/publish.mjs
